        <h1>Neem contact op</h1>

    </section>
    <section>
        <form class="contact" action="mailto:9027876@student.zadkine.nl" method="post" enctype="text/plain">

                <legend id="legend">Contact</legend>
            <label for="naam">Naam:</label>
            <input type="text" id="naam" name="naam" required placeholder="verplicht veld">

            <label for="email">E-mailadres:</label>
            <input type="email" id="email" name="email" required placeholder="verplicht veld">
            <br>
            <label for="bericht">Bericht:</label>
            <textarea id="bericht" name="bericht" required placeholder="verplicht veld" ></textarea>
            <br>
            <input type="submit" name="Verzend">
            </fieldset>
